worker_processes auto;
events { worker_connections 1024; }

http {
    # Redirige todo HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # TLS 1.3 EXCLUSIVAMENTE — sin fallback a 1.2.
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # HSTS — fuerza HTTPS en navegadores que ya conectaron una vez.
        add_header Strict-Transport-Security "max-age=63072000" always;
        # Endurecimientos básicos.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # CSP — limita qué orígenes puede cargar el SPA cuando nginx lo sirva.
        # `style-src 'unsafe-inline'`: framer-motion/three.js inyectan estilos
        # inline en runtime; si quitas eso la animación se rompe. Scripts NO
        # llevan unsafe-inline ni unsafe-eval (build de Vite no los necesita).
        # `connect-src 'self'`: el SPA solo habla con su mismo origen.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # Permissions-Policy — apaga APIs del navegador que el SPA no usa.
        # Reduce superficie de ataque si un XSS intenta abusarlas.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;

        # Aislamiento cross-origin: bloquea que otra ventana lea esta sesión.
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        client_max_body_size 5m;

        location / {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }
    }
}
